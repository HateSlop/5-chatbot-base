<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }}와 대화하기</title>
    <link rel="stylesheet" href="{{ asset_url('assets/css/style.css') }}">
    <script src="{{ asset_url('assets/js/chatbot.js') }}" defer></script>
  </head>
  <body class="chat-page">
    <header class="chat-header">
      <h1>{{ bot.name }}</h1>
      <a class="close-button" href="{{ url_for('index') }}" aria-label="대화 닫기">&times;</a>
    </header>
    <main class="chat-area" data-username="{{ username }}">
      <div id="chat-log" role="log" aria-live="polite" aria-label="대화 내용">
        <div class="message bot"><p>{{ bot.greeting }}</p></div>
      </div>
      <form id="chat-form" class="chat-input-area">
        <label class="visually-hidden" for="user-message">메시지</label>
        <input id="user-message" type="text" maxlength="2000" placeholder="메시지를 입력하세요..." autocomplete="off" required>
        <button id="send-btn" class="send-button" type="submit">전송</button>
      </form>
    </main>
  </body>
</html>
