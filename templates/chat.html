<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }} — 이야기</title>
    <link rel="stylesheet" href="{{ asset_url('assets/css/style.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/screen.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/story-portrait.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/dialogue-stage.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/post-move-ui.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/arrival-preview.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/village-theme.css') }}">
    <link rel="stylesheet" href="{{ asset_url('assets/css/cathy-basket.css') }}">
    <script src="{{ asset_url('assets/js/dialogue-stage.js') }}" defer></script>
    <script src="{{ asset_url('assets/js/post-move-ui.js') }}" defer></script>
    <script src="{{ asset_url('assets/js/chatbot.js') }}" defer></script>
    <script src="{{ asset_url('assets/js/name-entry.js') }}" defer></script>
    <script src="{{ asset_url('assets/js/arrival-entry.js') }}" defer></script>
  </head>
  <body class="chat-page">
    <div id="name-screen">
      <section id="entry-stage" class="game-screen dialogue-stage" aria-label="지미 방문과 이름 입력">
        <img class="dialogue-background" alt="" hidden><img class="dialogue-figure" alt="" hidden>
        <div class="dialogue-tv" hidden></div>
        <div class="dialogue-box" tabindex="0" role="region" aria-label="현재 대사" aria-live="polite" hidden><span class="dialogue-speaker"></span><span class="dialogue-text"></span><button id="entry-depart" class="dialogue-advance" type="button" hidden>이사하기 ›</button><button id="entry-answer" class="dialogue-advance" type="button" hidden>이름 입력하기 ›</button></div>
      </section>
      <form id="entry-chat" class="chat-input-area" hidden>
        <textarea id="entry-message" aria-label="이름 입력 전 대화" disabled></textarea><button id="entry-send" type="submit" disabled>보내기</button>
      </form>
      <dialog id="entry-name-dialog" class="entry-name-dialog" aria-label="이름 입력">
        <form id="name-form" novalidate>
          <label for="username">이름:</label>
          <input id="username" type="text" placeholder="이름을 입력하세요" autocomplete="off" enterkeyhint="done" aria-describedby="name-status" autofocus required>
          <button id="name-submit" class="visually-hidden" type="submit" tabindex="-1">이름 확인</button>
          <p id="name-status" role="status" aria-live="polite"></p>
        </form>
      </dialog>
    </div>
    <div id="game-screen" class="game-screen story-screen" hidden>
    <section id="dialogue-stage" class="dialogue-stage" aria-label="현재 대사 장면">
      <img class="dialogue-background" alt="" hidden>
      <img class="dialogue-figure" alt="" hidden>
      <div class="dialogue-tv" role="img" aria-label="TV" hidden></div>
      <div class="dialogue-box" tabindex="0" role="region" aria-label="현재 대사" aria-live="polite"><span class="dialogue-speaker"></span><span class="dialogue-text"></span></div>
    </section>
    <header class="story-header">
      <a class="wordmark" href="{{ url_for('index') }}">THE NEW VILLAGE <span>더뉴빌리지로 오세요</span></a>
      <button id="restart-btn" class="text-button" type="button">처음부터 시작</button>
    </header>
    <main class="story-layout" data-player-name="{{ username }}">
      <div id="scene-background" class="scene-background" role="img" aria-label="새집 배경"></div>
      <div class="scene-caption">
        <div class="eyebrow">YOU ARE HERE</div>
        <h1 id="location-title">새집</h1>
        <p id="scene-character">현재 대화 상대: 지미</p>
      </div>
      <div class="affinity-card">
        <span>호감도</span>
        <output id="affinity-value" aria-label="호감도">70 / 100</output>
      </div>
      <img id="character-portrait" class="character-portrait" alt="" hidden>
      <details class="conversation conversation-record" aria-label="대화 기록">
        <summary>대화 기록</summary>
        <div class="conversation-heading">
          <div class="eyebrow">CONVERSATION</div><h2 id="character-title">대화 상대를 기다리는 중</h2>
        </div>
        <div id="chat-log" class="chat-log" role="log" aria-live="off" aria-label="현재 장면과 인물의 대화 기록"></div>
        <p id="status-message" class="status-message" role="status"></p>
        <form id="chat-form" class="chat-input-area">
          <label class="visually-hidden" for="user-message">대화 입력</label>
          <textarea id="user-message" maxlength="2000" placeholder="이웃에게 말을 걸어 보세요" aria-label="대화 입력" autocomplete="off" required disabled></textarea>
          <button id="send-btn" class="send-button" type="submit" disabled>보내기</button>
        </form>
      </details>
      <details class="journal">
        <summary>나의 생각과 단서</summary>
        <p class="journal-intro">대화와 조사를 통해 알게 된 사실이 여기에 기록됩니다.</p>
        <ul id="journal-list"></ul>
        <div id="ending-card" class="ending-card" hidden></div>
        <button id="ending-restart" type="button" hidden>새 이름으로 다시 시작</button>
      </details>
      <nav class="story-actions" aria-label="할 수 있는 일">
        <div id="action-list" class="action-list"></div>
      </nav>
    </main>
    </div>
    <dialog id="photo-dialog" class="photo-dialog" aria-label="지미 액자 살펴보기">
      <button id="photo-close" class="photo-close" type="button" aria-label="액자 닫기">닫기 ×</button>
      <button id="photo-flip" class="photo-flip" type="button" aria-label="액자 뒤집어 뒷면 보기" data-back="false">
        <span class="photo-card">
          <img class="photo-front" src="{{ asset_url('assets/images/props_photo_front.png') }}" alt="안경을 쓴 지미의 사진 액자" draggable="false">
          <img class="photo-back" src="{{ asset_url('assets/images/props_photo_back.png') }}" alt="Jimmy라는 이름이 적힌 액자 뒷면" aria-hidden="true" draggable="false">
        </span>
      </button>
      <p id="photo-hint" class="photo-hint" aria-live="polite">사진을 누르면 뒷면을 볼 수 있습니다.</p>
    </dialog>
    <dialog id="cathy-basket-dialog" class="cathy-basket-dialog" aria-label="미용실 바구니 확대">
      <button id="cathy-basket-close" type="button" aria-label="바구니 닫기">닫기 ×</button>
      <div class="basket-scene">
        <img id="cathy-basket-image" src="{{ asset_url('assets/images/cathy_basket_placeholder.svg') }}" alt="확대된 미용 도구 바구니" draggable="false">
        <div id="cathy-basket-request" class="basket-request" role="status" aria-live="polite" hidden></div>
        <div id="cathy-tool-list" class="cathy-tool-list" aria-label="바구니 속 도구" hidden>
          <button type="button" data-tool="shampoo">🧴 샴푸</button>
          <button type="button" data-tool="scissors">✂️ 가위</button>
          <button type="button" data-tool="conditioner">🧴 린스</button>
          <button type="button" data-tool="comb">🪮 빗</button>
          <button type="button" data-tool="dryer">♨️ 드라이어</button>
          <button type="button" data-tool="spray">💈 스프레이</button>
        </div>
      </div>
      <p id="cathy-basket-hint" hidden>캐시가 부탁한 도구를 모두 골라 주세요.</p>
      <button id="cathy-deliver" type="button" hidden>캐시에게 전달한다</button>
      <p id="cathy-basket-status" role="status" aria-live="polite"></p>
    </dialog>
  </body>
</html>
