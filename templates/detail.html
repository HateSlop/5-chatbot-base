<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }} · 소개</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
  </head>
  <body>
    <main class="shell narrow">
      <a class="back-link" href="{{ url_for('index') }}">← 처음으로</a>
      <section class="card profile" aria-labelledby="bot-name">
        <img class="avatar" src="{{ bot.image }}" alt="{{ bot.name }} 대표 이미지">
        <h1 id="bot-name">{{ bot.name }}</h1>
        <p>{{ bot.description }}</p>
        {% if bot.tags %}
        <ul class="tags" aria-label="캐릭터 태그">
          {% for tag in bot.tags %}<li>{{ tag }}</li>{% endfor %}
        </ul>
        {% endif %}
        <form action="{{ url_for('chat') }}" method="get" class="name-form">
          <label for="username">대화에서 사용할 이름</label>
          <input id="username" name="username" type="text" maxlength="50" placeholder="사용자" autocomplete="nickname">
          <button class="button" type="submit">대화 시작하기</button>
        </form>
      </section>
    </main>
  </body>
</html>
