<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발용 대사 화면 미리보기</title>
<link rel="stylesheet" href="/assets/css/screen.css">
<link rel="stylesheet" href="/assets/css/dialogue-stage.css">
<link rel="stylesheet" href="/assets/css/post-move-ui.css">
<style>
body { margin: 0; background: #090b09; color: #f3e4bd; font: 16px/1.5 sans-serif; }
.preview-controls { max-width: 540px; padding: 16px; margin: auto; }
input, button { font: inherit; min-height: 44px; max-width: 100%; box-sizing: border-box; }
button { margin-top: 8px; }
</style>
<link rel="stylesheet" href="/assets/css/village-theme.css">
<div class="preview-controls">
  <strong>개발용 미리보기 · 저장 및 API 호출 없음</strong>
  <p>실제 도입 대사는 아직 없습니다. 아래 문구는 배치 확인용입니다.</p>
  <div><button id="tv">이사 전 집·TV</button> <button id="jimmy">지미·새집</button> <button id="karen">캐런·집</button> <button id="bob">밥·정육점</button> <button id="cathy">캐시·미용실</button> <button id="long">긴 독백</button> <button id="missing">이미지 누락</button></div>
  <p><a href="/dev/post-move.html" style="color:inherit">이사 이후 인터페이스 미리보기 →</a></p>
  <div><button id="karen_smile">캐런 웃음</button><button id="secret">비밀 방 (개발용)</button><button id="secret_angle">비밀 방 다른 각도 (개발용)</button><button id="basement">정육점 지하실 (개발용)</button></div>
  <p><a href="/dev/arrival.html" style="color:inherit">지미 방문·이름 입력 첫 장면 미리보기 →</a></p>
</div>
<section class="game-screen dialogue-stage" id="preview-stage" aria-label="개발용 대사 장면">
  <img class="dialogue-background" alt="" hidden>
  <img class="dialogue-figure" alt="" hidden>
  <div class="dialogue-tv" role="img" aria-label="TV" hidden></div>
  <div class="dialogue-box" tabindex="0" role="region" aria-label="현재 대사" aria-live="polite"><span class="dialogue-speaker"></span><span class="dialogue-text"></span></div>
</section>
<form id="preview-form" class="chat-input-area">
  <textarea id="preview-input" aria-label="개발용 대화 입력" placeholder="개발용 입력 · 전송 및 저장 없음" maxlength="2000"></textarea>
  <button id="preview-send" class="send-button" type="submit">입력 확인</button>
</form>
<script src="/assets/js/dialogue-stage.js"></script>
<script src="/assets/js/post-move-ui.js"></script>
<script src="/assets/js/dialogue-preview.js"></script>
</html>
