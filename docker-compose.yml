services:
  chatbot:
    build: .
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      PORT: "5000"
      FLASK_DEBUG: "1"
    volumes:
      - ./app.py:/app/app.py:ro
      - ./services:/app/services:ro
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
      - ./public:/app/public:ro
      - ./data/knowledge:/app/data/knowledge:ro
      - ./tests:/app/tests:ro
    command: python app.py
